<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의료기관 찾기 - 감염병 정보 시스템</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/hospitals.css">
</head>
<body>
    <!-- 헤더 섹션 -->
    <header class="header-section">
        <div class="header-pattern">
            <div class="pattern-blob pattern-blob-1"></div>
            <div class="pattern-blob pattern-blob-2"></div>
        </div>

        <div class="header-wrapper">
            <div class="header-title-section">
                <button class="back-btn" onclick="window.location.href='index.html'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    메인으로
                </button>
                <h1 class="header-title">의료기관 찾기</h1>
                <p class="header-subtitle">내 위치 기반으로 주변 의료기관을 찾아보세요</p>
            </div>
        </div>
    </header>

    <!-- 전체 화면 지도 컨테이너 -->
    <div class="fullscreen-map-container">
        <div id="hospitalMap" class="fullscreen-map"></div>

        <!-- 지도 내부 컨트롤 -->
        <div class="map-controls-overlay">
            <div class="map-control-panel">
                <div class="control-item">
                    <label>검색 반경</label>
                    <select id="radiusSelect" onchange="onRadiusChange()">
                        <option value="1">1km</option>
                        <option value="3" selected>3km</option>
                        <option value="5">5km</option>
                        <option value="10">10km</option>
                    </select>
                </div>
                <button class="map-control-btn" id="placeMarkerBtn" onclick="togglePlaceMarkerMode()">
                    📌 마커 찍기
                </button>
                <button class="map-control-btn" onclick="refreshMyLocation()">
                    📍 내 위치로
                </button>
            </div>
        </div>

        <!-- 검색 상태 표시 -->
        <div class="map-status-overlay">
            <p id="searchStatus">위치를 확인하는 중...</p>
        </div>
    </div>

    <!-- 카카오맵 API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=032c96ae926c58d7aee0b852df64e54f&libraries=services"></script>
    <script src="scripts/hospitals.js"></script>
</body>
</html>
